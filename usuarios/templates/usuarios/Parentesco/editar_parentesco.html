{% extends "base.html" %}

{% block title %}Editar Parentesco{% endblock %}

{% block content %}
<div class="container py-4" style="max-width: 600px;">
    <div class="card border-0 shadow-sm rounded-3">
        <div class="card-header bg-white border-0 pt-4 px-4">
            <h4 class="fw-bold text-warning mb-0">
                <i class="bi bi-pencil-square me-2"></i>Editar Parentesco
            </h4>
        </div>
        <div class="card-body p-4">
            <form method="post">
                {% csrf_token %}
                <div class="mb-4">
                    <label for="id_nombre_parentesco" class="form-label fw-semibold">Nombre del Parentesco</label>
                    <input type="text" name="nombre_parentesco" value="{{ object.nombre_parentesco }}" class="form-control" id="id_nombre_parentesco" required>
                </div>
                <div class="d-flex justify-content-end gap-2">
                    <a href="{% url 'parentescomodel_list' %}" class="btn btn-light border fw-semibold">Cancelar</a>
                    <button type="submit" class="btn btn-warning fw-bold">Actualizar Changes</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
