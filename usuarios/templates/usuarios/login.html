{% extends "base.html" %}

{% block title %}Iniciar Sesión{% endblock %}

{% block content %}
<div class="container py-5 d-flex justify-content-center">
    <div class="card border-0 shadow-sm rounded-3" style="max-width: 400px; width: 100%;">
        <div class="card-header bg-white border-0 pt-4 text-center">
            <h4 class="fw-bold text-primary mb-0">Iniciar Sesión</h4>
            <p class="text-muted small mt-1">Ingresa tus credenciales para continuar</p>
        </div>
        <div class="card-body p-4">
            <form method="post">
                {% csrf_token %}
                <div class="mb-3">
                    <label for="id_username" class="form-label fw-semibold">Usuario</label>
                    <input type="text" name="username" class="form-control" id="id_username" required autofocus>
                </div>
                <div class="mb-4">
                    <label for="id_password" class="form-label fw-semibold">Contraseña</label>
                    <input type="password" name="password" class="form-control" id="id_password" required>
                </div>
                <button type="submit" class="btn btn-primary w-100 fw-bold py-2">Entrar</button>
                <div class="text-center mt-3">
                    <small class="text-muted">¿No tienes una cuenta? </small>
                    <a href="{% url 'registro_publico' %}" class="fw-bold text-decoration-none">Registrarte</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
