{% extends "academia/base.html" %}

{% block title %}Nuevo Plan de Estudio | Rakidane{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
        <div class="card shadow-sm p-4">
            <div class="card-body">
                <div class="d-flex align-items-center mb-3">
                    <i class="bi bi-journal-plus text-primary fs-2 me-2"></i>
                    <h3 class="card-title text-primary mb-0">Crear Plan de Estudio</h3>
                </div>
                <p class="text-muted small mb-4">Ingresa los datos para registrar un nuevo plan académico.</p>
                <hr>
                
                <form method="post" class="needs-validation" novalidate>
                    {% csrf_token %}
                    
                    <div class="mb-3">
                        {{ form.as_p }}
                    </div>

                    <div class="d-flex justify-content-between align-items-center mt-4 pt-2 border-top">
                        <a href="/academia/planes_estudio/" class="btn btn-outline-secondary">
                            <i class="bi bi-arrow-left me-1"></i> Cancelar
                        </a>
                        <button type="submit" class="btn btn-primary px-4">
                            <i class="bi bi-check-circle me-1"></i> Guardar
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    document.addEventListener("DOMContentLoaded", function() {
        const inputs = document.querySelectorAll('form input, form select, form textarea');
        inputs.forEach(input => {
            if (input.type === 'checkbox' || input.type === 'radio') {
                input.classList.add('form-check-input');
            } else {
                input.classList.add('form-control');
            }
        });
    });
</script>
{% endblock %}
