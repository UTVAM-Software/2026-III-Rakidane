{% extends "base.html" %}

{% block title %}Eliminar Parentesco{% endblock %}

{% block content %}
<div class="container py-4" style="max-width: 500px;">
    <div class="card border-0 shadow-sm rounded-3">
        <div class="card-body p-4 text-center">
            <i class="bi bi-exclamation-triangle-fill text-danger display-4 mb-3 d-block"></i>
            <h4 class="fw-bold text-dark mb-2">¿Eliminar Parentesco?</h4>
            <p class="text-muted mb-4">¿Estás seguro de eliminar el tipo de parentesco <strong>"{{ object.nombre_parentesco }}"</strong>? Esta acción no se puede deshacer.</p>

            <form method="post">
                {% csrf_token %}
                <div class="d-flex justify-content-center gap-2">
                    <a href="{% url 'parentescomodel_list' %}" class="btn btn-light border fw-semibold">Cancelar</a>
                    <button type="submit" class="btn btn-danger fw-bold">Sí, Eliminar</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
