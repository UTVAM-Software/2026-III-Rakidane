<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Gestión de Usuarios{% endblock %}</title>
    <!-- Bootstrap 5 CSS & Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body class="bg-light d-flex flex-column min-vh-100">

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4 shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#">
                <i class="bi bi-people-fill me-2"></i>Gestión de Usuarios
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-link navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'alumno_list' %}"><i class="bi bi-mortarboard me-1"></i> Alumnos</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'docente_list' %}"><i class="bi bi-person-badge me-1"></i> Docentes</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'tutorpadre_list' %}"><i class="bi bi-person-heart me-1"></i> Tutores</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'cuentaacceso_list' %}"><i class="bi bi-key me-1"></i> Cuentas</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Main Content Container -->
    <main class="container flex-grow-1">
        {% block content %}
        {% endblock %}
    </main>

    <!-- Footer -->
    <footer class="bg-white text-center text-muted py-3 border-top mt-5">
        <div class="container">
            <small>&copy; {% now "Y" %} Sistema Módulo Usuarios - Todos los derechos reservados.</small>
        </div>
    </footer>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
