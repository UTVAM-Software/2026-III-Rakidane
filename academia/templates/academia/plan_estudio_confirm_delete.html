{% extends "academia/base.html" %}

{% block title %}Eliminar Plan de Estudio | Rakidane{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card border-danger shadow-sm">
            <div class="card-body text-center p-4">
                <i class="bi bi-exclamation-triangle-fill text-danger fs-1 mb-3"></i>
                <h4 class="card-title text-danger">¿Estás seguro de eliminar este registro?</h4>
                <p class="text-muted my-3">Esta acción no se puede deshacer. Vas a eliminar: <br><strong>"{{ object }}"</strong></p>

                <form method="post">
                    {% csrf_token %}
                    <div class="d-flex justify-content-center gap-2 mt-4">
                        <a href="/academia/planes_estudio/" class="btn btn-secondary">Cancelar</a>
                        <button type="submit" class="btn btn-danger px-4">Sí, eliminar</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
