{% extends 'base.html' %}

{% block title %}Detalle del Archivo{% endblock %}

{% block content %}
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card border-0 shadow-sm rounded-3">
                <div class="card-header bg-primary text-white py-3 rounded-top d-flex justify-content-between align-items-center">
                    <h4 class="mb-0 fw-bold"><i class="bi bi-file-earmark-arrow-down me-2"></i>Detalle de Archivo</h4>
                </div>
                <div class="card-body p-4">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label text-muted small fw-bold">NOMBRE ORIGINAL DEL ARCHIVO</label>
                            <p class="fs-5 fw-bold text-dark">{{ object.nombre_original|default:"Sin nombre asignado" }}</p>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label text-muted small fw-bold">ENTREGA ASOCIADA</label>
                            <p class="fs-5 text-dark"><i class="bi bi-person me-1 text-primary"></i>{{ object.id_entrega.id_alumno }}</p>
                        </div>
                        <div class="col-12">
                            <hr class="text-muted opacity-25">
                            <label class="form-label text-muted small fw-bold">RUTA DE ALMACENAMIENTO</label>
                            <div class="bg-light p-3 rounded font-monospace text-dark text-break">
                                {{ object.ruta_almacenamiento }}
                            </div>
                        </div>
                    </div>
                </div>
                <div class="card-footer bg-light py-3 d-flex justify-content-between">
                    <a href="{% url 'archivoentrega_list' %}" class="btn btn-outline-secondary">
                        <i class="bi bi-arrow-left me-1"></i> Regresar
                    </a>
                    <div>
                        <a href="{% url 'archivoentrega_update' object.pk %}" class="btn btn-warning me-2">
                            <i class="bi bi-pencil me-1"></i> Editar
                        </a>
                        <a href="{% url 'archivoentrega_delete' object.pk %}" class="btn btn-danger">
                            <i class="bi bi-trash me-1"></i> Eliminar
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
