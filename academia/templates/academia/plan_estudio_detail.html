{% extends "academia/base.html" %}

{% block title %}Detalle de Plan de Estudio | Rakidane{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card shadow-sm">
            <div class="card-header bg-primary text-white py-3">
                <h4 class="mb-0"><i class="bi bi-info-circle me-2"></i>Detalle del Plan de Estudio</h4>
            </div>
            <div class="card-body p-4">
                <h3 class="text-dark mb-3">{{ object }}</h3>
                <hr>
                <div class="row g-3">
                    <div class="col-md-6">
                        <p class="text-muted mb-1">ID de Registro</p>
                        <h5>{{ object.id }}</h5>
                    </div>
                </div>
            </div>
            <div class="card-footer bg-light d-flex justify-content-between py-3">
                <a href="/academia/planes_estudio/" class="btn btn-outline-secondary">
                    <i class="bi bi-arrow-left me-1"></i> Volver a la lista
                </a>
                <a href="/academia/planes_estudio/{{ object.id }}/update/" class="btn btn-warning">
                    <i class="bi bi-pencil me-1"></i> Editar
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
