{% extends "base.html" %}

{% block title %}Detalle del Parentesco{% endblock %}

{% block content %}
<div class="container py-4" style="max-width: 600px;">
    <div class="card border-0 shadow-sm rounded-3">
        <div class="card-body p-4">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h4 class="fw-bold text-dark mb-0">{{ object.nombre_parentesco }}</h4>
                <span class="badge bg-info text-dark">ID: {{ object.pk }}</span>
            </div>
            <hr>
            <div class="d-flex justify-content-end gap-2 mt-4">
                <a href="{% url 'parentescomodel_list' %}" class="btn btn-light border fw-semibold">Volver a la lista</a>
                <a href="{% url 'parentescomodel_update' object.pk %}" class="btn btn-warning fw-semibold">Editar</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
