{% extends 'base.html' %}

{% block title %}Editar Estado de Revisión{% endblock %}

{% block content %}
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-lg-6">
            <div class="card border-0 shadow-sm rounded-3">
                <div class="card-header bg-white py-3 border-bottom">
                    <h4 class="mb-0 fw-bold text-warning"><i class="bi bi-pencil-square me-2"></i>Editar Estado de Revisión</h4>
                </div>
                <div class="card-body p-4">
                    <form method="post" novalidate>
                        {% csrf_token %}
                        {% for field in form %}
                        <div class="mb-3">
                            <label for="{{ field.id_for_label }}" class="form-label fw-semibold text-secondary">
                                {{ field.label }}
                            </label>
                            <input type="text" name="{{ field.name }}" id="{{ field.id_for_label }}" value="{{ field.value|default:'' }}" class="form-control {% if field.errors %}is-invalid{% endif %}" required>
                            {% for error in field.errors %}<div class="invalid-feedback d-block">{{ error }}</div>{% endfor %}
                        </div>
                        {% endfor %}
                        <div class="d-flex justify-content-end gap-2 mt-4">
                            <a href="{% url 'estadorevision_list' %}" class="btn btn-light border">Cancelar</a>
                            <button type="submit" class="btn btn-warning text-dark shadow-sm"><i class="bi bi-arrow-repeat me-1"></i> Actualizar</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
